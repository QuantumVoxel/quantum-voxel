//file:noinspection GroovyUnusedCatchParameter
//file:noinspection GroovyAssignabilityCheck


import org.intellij.lang.annotations.Language

import java.nio.file.Files
import java.nio.file.Paths

import static org.gradle.api.file.DuplicatesStrategy.EXCLUDE
import static org.gradle.api.file.DuplicatesStrategy.INCLUDE

buildscript {
    repositories {
        mavenCentral()

        maven {
            url = "https://oss.sonatype.org/content/repositories/snapshots/"
            name = "sonatype"
        }

        maven {
            url = "https://maven.atlassian.com/3rdparty/"
        }

        google()
    }

    dependencies {
        classpath "com.google.code.gson:gson:2.13.1"
    }
}

apply plugin: 'java'
apply plugin: 'java-library'

@Language("jvm-class-name")
def mainClass = 'dev.ultreon.xeox.impl.main.Main'

group projectGroup // https://maven.apache.org/guides/mini/guide-naming-conventions.html

java {
    withSourcesJar()
    withJavadocJar()
}

dependencies {
    implementation api("org.jetbrains:annotations:24.0.0")

    annotationProcessor "com.google.errorprone:error_prone_annotations:2.41.0"

    implementation api("dev.ultreon:ubo:$uboVersion")

    // LibGDX
    implementation api("com.badlogicgames.gdx:gdx:$gdxVersion")

    api "dev.ultreon.JNoiseJDK11:jnoise-core:bcafb2465b", {
        exclude group: "org.jspecify", module: "jspecify"
    }
    api "dev.ultreon.JNoiseJDK11:jnoise-pipeline:bcafb2465b", {
        exclude group: "org.jspecify", module: "jspecify"
    }
    api "dev.ultreon.JNoiseJDK11:jnoise-generators:bcafb2465b", {
        exclude group: "org.jspecify", module: "jspecify"
    }
    api "dev.ultreon.JNoiseJDK11:jnoise-modifiers:bcafb2465b", {
        exclude group: "org.jspecify", module: "jspecify"
    }
    api "dev.ultreon.JNoiseJDK11:jnoise-modules:bcafb2465b", {
        exclude group: "org.jspecify", module: "jspecify"
    }

    implementation api("space.earlygrey:shapedrawer:$shapeDrawerVersion")

    implementation api("com.google.code.findbugs:jsr305:$jsrVersion")
}

processResources {
    from(file("$rootProject.projectDir/LICENSE")) { into "META-INF/" }
    exclude "*.pdn", "*.xcf", "*.ps", "*.cache", "*.tmp", "*.temp", "*.bak", "*.old"

    inputs.property "version", version

    filesMatching("metadata.json") {
        expand(["version": version])
    }
    duplicatesStrategy INCLUDE
}

jar {
    //noinspection GroovyAssignabilityCheck
    manifest {
        //noinspection GroovyAssignabilityCheck
        attributes 'Implementation-Title': 'Quantum Voxel',
                'Implementation-Vendor': 'Ultreon Studios',
                project_version: project.version,
                'Main-Class': mainClass
    }

    from(compileJava.outputs)
    from(processResources.outputs)

    zip64 true
    duplicatesStrategy INCLUDE
}

test {
    useJUnitPlatform()

    // If the runClient task is executed, set the environment variable for RUNNING to true
    afterEvaluate {
        if (rootProject.gradle.taskGraph.hasTask(":runClient")) {
            environment("RUNNING", "true")
        }
    }
}

//noinspection ConfigurationAvoidance
tasks.create("serverJar", Jar) {
    dependsOn jar

    archiveFileName = "server.jar"

    from compileJava.outputs
    from processResources.outputs

    duplicatesStrategy EXCLUDE

    manifest {
        //noinspection GroovyAssignabilityCheck
        attributes 'Implementation-Title': 'Quantum Voxel',
                'Implementation-Vendor': 'Ultreon Studios',
                project_version: project.version,
                'Main-Class': mainClass
    }

    zip64 true
}

tasks.register('prepareRun', {
    Files.createDirectories(Paths.get(rootProject.projectDir.getAbsolutePath(), "run"))
})

tasks.withType(ProcessResources).configureEach {
    duplicatesStrategy INCLUDE
}

tasks.withType(Jar).configureEach {
    duplicatesStrategy INCLUDE
}

tasks.register('copyDependencies', Copy) {
    from(configurations.runtimeClasspath)
    into("$projectDir/build/jars")
}

tasks.register('copyJar', Copy) {
    from(tasks.jar)
    into("$projectDir/build/jars")
}

compileJava {
    options.encoding = "UTF-8"
}
